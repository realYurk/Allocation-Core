name: Full-source Windows Portable Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Start_Windows.cmd'
      - 'studio-src/**'
      - 'core/**'
      - '.github/workflows/build-complete.yml'
      - 'tools/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test both modules
        shell: bash
        run: |
          (cd core && go test ./... && go vet ./...)
          (cd studio-src && go test ./... && go vet ./...)
      - name: Build all supported platforms
        shell: bash
        run: |
          set -euo pipefail
          for os in windows linux darwin; do
            for arch in amd64 arm64; do
              ext=""; if [ "$os" = windows ]; then ext=.exe; fi
              (cd core && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false -o "alloc_${os}_${arch}${ext}" ./cmd/alloc)
              (cd studio-src && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false -o "../studio_${os}_${arch}${ext}" .)
            done
          done
      - name: Archive complete source with binaries
        shell: bash
        run: |
          python3 tools/make_release.py . dist/Allocation-Core-Full-Source-With-Executables.zip
      - name: Verify all built executables and manifest
        run: python3 tools/verify_distribution.py . --all-platforms
      - uses: actions/upload-artifact@v4
        with:
          name: Allocation-Core-COMPLETE-SOURCE-AND-WINDOWS
          path: dist/Allocation-Core-Full-Source-With-Executables.zip
          if-no-files-found: error
  windows-smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Allocation-Core-COMPLETE-SOURCE-AND-WINDOWS
          path: received
      - name: Verify Windows Studio and core launch
        shell: pwsh
        run: |
          Expand-Archive -Path 'received/Allocation-Core-Full-Source-With-Executables.zip' -DestinationPath 'release'
          $root = (Resolve-Path 'release/Allocation-Core').Path
          $core = Join-Path $root 'core/alloc_windows_amd64.exe'
          $studio = Join-Path $root 'studio_windows_amd64.exe'
          if (!(Test-Path $core) -or !(Test-Path $studio)) { throw 'EXE missing' }
          & $core validate (Join-Path $root 'core/examples/manufacturing/rule.json')
          if ($LASTEXITCODE -ne 0) { throw 'Core validate failed' }
          $p = Start-Process -FilePath $studio -ArgumentList @('-root', ('"'+$root+'"'),'-listen','127.0.0.1:8866','-no-browser') -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-RestMethod 'http://127.0.0.1:8866/api/health' -TimeoutSec 2
                if ($r.status -eq 'ok') { $ok = $true; break }
              } catch {}
            }
            if (!$ok) { throw 'Studio did not respond to /api/health' }
            $page = Invoke-WebRequest 'http://127.0.0.1:8866/designer' -UseBasicParsing
            if ($page.StatusCode -ne 200) { throw 'Designer inaccessible' }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
