name: Clean Core CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and generate only synthetic data
        run: |
          go build -o AllocationCore .
          ./AllocationCore demo .
      - name: Go tests, static checks and examples
        run: |
          go test ./... -count=1
          go vet ./...
          go test -race ./internal/multi ./internal/studio ./internal/engine ./adapter ./internal/acceptance ./internal/profiling
          # Independent rational oracle, fixed business goldens and failure injection.
          go test ./internal/engine ./adapter ./internal/acceptance -run 'TestV7|TestV8' -count=1 -v
          # Performance measurements are archived as diagnostics, never flaky pass/fail gates.
          mkdir -p output
          go test ./internal/engine -run '^$' -bench 'BenchmarkShardEncoding|BenchmarkPoolScheduler|BenchmarkV8PartitionSpool|BenchmarkV9PartitionSpool64' -benchmem -benchtime=150ms > output/ci-benchmark.txt
          ./AllocationCore inspect examples/manufacturing/rule.json
          ./AllocationCore data csv --config examples/import_mapping.json output/ci-normalized.csv
          ./AllocationCore profile examples/manufacturing/rule.json output/ci-profile --workers 2 --disk-partitions 4 --evidence-gzip
          ./AllocationCore run examples/manufacturing/rule.json output/ci-simple --workers 4
          ./AllocationCore multi inspect -project testdata/multi_sample -json > output/ci-preflight.json
          ./AllocationCore multi -project testdata/multi_sample -out output/ci-multi -engine ./AllocationCore
          # Self-compare checks the reconciliation command's I/O. Synthetic
          # multi-stage output can legitimately contain repeated coordinates;
          # strict duplicate rejection is separately covered by V7 unit tests.
          ./AllocationCore reconcile --actual output/ci-multi/results.csv --reference output/ci-multi/results.csv --out output/ci-acceptance --precision 2 --tolerance 0
          ./AllocationCore demo . 1000
          ./AllocationCore multi inspect -project testdata/scale_1000 -json > output/ci-preflight-1000.json
          ./AllocationCore multi -project testdata/scale_1000 -out output/ci-pooled-1000 -engine ./AllocationCore
      - name: Public source audit
        run: |
          ! git ls-files | grep -Ei '\.(csv|xlsx|xls|exe|db|sqlite|parquet)$'
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build one executable
        shell: pwsh
        run: |
          go mod download
          go build -tags mysql -trimpath -ldflags="-s -w" -o AllocationCore.exe .
          .\AllocationCore.exe demo .
          .\AllocationCore.exe inspect examples/manufacturing/rule.json
          .\AllocationCore.exe data csv --config examples/import_mapping.json output\ci-normalized.csv
          .\AllocationCore.exe profile examples/manufacturing/rule.json output\ci-profile --workers 2 --disk-partitions 4
          .\AllocationCore.exe run examples/manufacturing/rule.json output\ci-simple --workers 2
          $bin = (Resolve-Path .\AllocationCore.exe).Path
          .\AllocationCore.exe multi inspect -project testdata\multi_sample -json
          go test ./internal/studio -run 'TestDesignerBridge' -count=1
          .\AllocationCore.exe multi -project testdata\multi_sample -out output\ci-multi -engine $bin
          .\AllocationCore.exe reconcile --actual output\ci-multi\results.csv --reference output\ci-multi\results.csv --out output\ci-acceptance --precision 2 --tolerance 0
      - name: Archive one-folder product
        shell: pwsh
        run: |
          $include = @('AllocationCore.exe','go.mod','go.sum','main.go','README.md','.gitignore','adapter','internal','examples','testdata','docs','input')
          New-Item -ItemType Directory -Force dist\Allocation-Core-Clean | Out-Null
          foreach ($item in $include) { Copy-Item -Recurse -Force $item dist\Allocation-Core-Clean\ }
          Get-ChildItem dist\Allocation-Core-Clean -Recurse -File | Where-Object { $_.Extension -in @('.csv','.xlsx','.xls','.db','.sqlite') } | Remove-Item -Force
          Compress-Archive -Path dist\Allocation-Core-Clean -DestinationPath dist\Allocation-Core-Clean-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Allocation-Core-Clean-Windows
          path: dist/Allocation-Core-Clean-Windows.zip

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: temporary_ci_only
          MYSQL_DATABASE: allocation_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptemporary_ci_only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download pinned official MySQL dependency
        run: go mod download
      - name: Native driver build and isolated InnoDB integration
        env:
          ALLOCATION_MYSQL_TEST_EPHEMERAL: "1"
          ALLOCATION_TEST_MYSQL_DSN: "root:temporary_ci_only@tcp(127.0.0.1:3306)/allocation_ci"
        run: |
          go build -tags mysql -o AllocationCore .
          # The real MySQL test now exports via a SELECT-only account, not root.
          go test -tags "mysql mysql_integration" ./adapter -run 'TestLiveMySQLSnapshot|TestV8LiveConcurrentDDLIsBlockedUntilSnapshotReleased' -count=1 -v
          # TLS/SAN full integration runs in the separate ephemeral PKI job below.
          go test -tags mysql ./adapter -count=1
          go vet -tags mysql ./adapter

  mysql-tls-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate purpose-issued short-lived CA and SAN certificate
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/allocation-ci-tls"
          mkdir -p "$DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 \
            -keyout "$DIR/ca-key.pem" -out "$DIR/ca.pem" \
            -subj '/CN=Allocation-Core-Temporary-Test-CA'
          openssl req -newkey rsa:2048 -nodes -sha256 \
            -keyout "$DIR/server-key.pem" -out "$DIR/server.csr" \
            -subj '/CN=mysql.test.internal'
          cat > "$DIR/server.ext" <<'CERTS'
          basicConstraints=CA:FALSE
          keyUsage=digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:mysql.test.internal,DNS:localhost,IP:127.0.0.1
          CERTS
          openssl x509 -req -in "$DIR/server.csr" -CA "$DIR/ca.pem" \
            -CAkey "$DIR/ca-key.pem" -CAcreateserial -out "$DIR/server-cert.pem" \
            -days 2 -sha256 -extfile "$DIR/server.ext"
          openssl verify -CAfile "$DIR/ca.pem" "$DIR/server-cert.pem"
          # Container's mysql group (GID 999) may read the key, not other users.
          sudo chgrp 999 "$DIR/server-key.pem"
          chmod 640 "$DIR/server-key.pem"
          chmod 755 "$DIR"
      - name: Start isolated MySQL 8.4 requiring TLS
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name allocation-ci-mysql-tls \
            -e MYSQL_ROOT_PASSWORD=isolated_root_ci_only \
            -e MYSQL_DATABASE=allocation_ci \
            -p 127.0.0.1:3307:3306 \
            --mount "type=bind,src=$RUNNER_TEMP/allocation-ci-tls,dst=/etc/mysql/certs,readonly" \
            mysql:8.4 \
            --ssl-ca=/etc/mysql/certs/ca.pem \
            --ssl-cert=/etc/mysql/certs/server-cert.pem \
            --ssl-key=/etc/mysql/certs/server-key.pem \
            --require_secure_transport=ON \
            --tls-certificates-enforced-validation=ON
          # mysqladmin ping can report "alive" even when authentication is
          # denied during image initialization. Test authenticated SQL itself.
          for n in $(seq 1 70); do
            if docker exec -e MYSQL_PWD=isolated_root_ci_only allocation-ci-mysql-tls \
                mysql -uroot -Nse 'SELECT 1' 2>/dev/null | grep -qx 1; then
              echo 'Authenticated MySQL SQL connection is ready'
              break
            fi
            if [ "$n" -eq 70 ]; then
              docker logs allocation-ci-mysql-tls --tail 120
              exit 1
            fi
            sleep 2
          done
      - name: Seed ephemeral database through container-local administrative socket
        shell: bash
        run: |
          set -euo pipefail
          # Admin is used ONLY inside the ephemeral container. The application
          # integration test uses a separately provisioned SELECT-only TLS user.
          docker exec -i -e MYSQL_PWD=isolated_root_ci_only allocation-ci-mysql-tls mysql -uroot allocation_ci <<'SQL'
          CREATE TABLE clean_connector_tls_v7 (
            id BIGINT PRIMARY KEY,
            period VARCHAR(20) NOT NULL,
            amount DECIMAL(20,2) NOT NULL
          ) ENGINE=InnoDB;
          INSERT INTO clean_connector_tls_v7 VALUES
            (1,'2026-01',12.34),(2,'2026-01',56.78);
          CREATE USER 'allocation_tls_ci'@'%' IDENTIFIED BY 'isolated-test-password' REQUIRE SSL;
          GRANT SELECT ON allocation_ci.clean_connector_tls_v7 TO 'allocation_tls_ci'@'%';
          SQL
          # MySQL 8.4 no longer exposes have_ssl. Verify a *real TCP
          # session* with a SELECT-only account, CA + certificate identity,
          # and a negotiated nonempty TLS cipher, rather than a socket ping.
          docker exec -e MYSQL_PWD=isolated_root_ci_only allocation-ci-mysql-tls mysql -uroot \
            -Nse "SHOW VARIABLES LIKE 'require_secure_transport';" | grep -Eq 'require_secure_transport[[:space:]]+ON'
          docker exec -e MYSQL_PWD=isolated-test-password allocation-ci-mysql-tls \
            mysql --protocol=TCP -h127.0.0.1 -P3306 -uallocation_tls_ci \
            --ssl-mode=VERIFY_IDENTITY --ssl-ca=/etc/mysql/certs/ca.pem \
            -Nse "SHOW SESSION STATUS LIKE 'Ssl_cipher';" | grep -Eq 'Ssl_cipher[[:space:]]+[^[:space:]]+'
      - name: Official driver, real CA/SAN TLS import and fail-closed negative test
        env:
          ALLOCATION_MYSQL_TEST_EPHEMERAL: "1"
          ALLOCATION_TEST_MYSQL_DSN: "root:isolated_root_ci_only@tcp(127.0.0.1:3307)/allocation_ci"
          ALLOCATION_TEST_MYSQL_TLS_CA_FILE: ${{ runner.temp }}/allocation-ci-tls/ca.pem
          ALLOCATION_TEST_MYSQL_TLS_SERVER_NAME: mysql.test.internal
          ALLOCATION_TEST_MYSQL_TLS_ADDRESS: "127.0.0.1:3307"
        run: |
          go mod download
          go build -tags mysql -o AllocationCore .
          if ! go test -tags "mysql mysql_integration" ./adapter -run '^TestLiveMySQLNativeTLSImport$' -count=1 -v; then
            docker logs allocation-ci-mysql-tls --tail 120
            exit 1
          fi
      - name: Remove ephemeral test database and certificate materials
        if: always()
        shell: bash
        run: |
          docker rm -f allocation-ci-mysql-tls 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/allocation-ci-tls"
